<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Nestify</title>
    <link rel="stylesheet" href="./css/dashboard-pro.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="./img/logo.png" alt="Nestify" class="brand-logo">
                <span class="brand-name">Nestify</span>
            </div>
            
            <nav class="sidebar-menu">
                <div class="menu-section">
                    <span class="menu-label">Main</span>
                    <a href="property-listings.html" class="menu-item" data-section="browse">
                        <span class="material-symbols-outlined">search</span>
                        <span>Browse Properties</span>
                    </a>
                    <a href="#" class="menu-item active" data-section="favorites">
                        <span class="material-symbols-outlined">favorite</span>
                        <span>Favorites</span>
                    </a>
                    <a href="#" class="menu-item" data-section="bookings">
                        <span class="material-symbols-outlined">event_note</span>
                        <span>My Bookings</span>
                    </a>
                    <a href="#" class="menu-item" data-section="messages">
                        <span class="material-symbols-outlined">chat</span>
                        <span>Messages</span>
                        <span class="badge" id="messageBadge" style="display: none;">0</span>
                    </a>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar" id="userAvatar">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="username">User</span>
                        <span class="user-role">Tenant</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <h1>My Profile</h1>
                    <p class="header-subtitle">Welcome back, <span id="welcomeName">User</span></p>
                </div>
            </header>

            <!-- Favorites Section -->
            <section id="favoritesSection" class="content-section active">
                <div class="section-header">
                    <h2>My Favorites</h2>
                    <p>Properties you've saved</p>
                </div>
                <div class="properties-grid" id="favoritesList">
                </div>
            </section>

            <!-- Bookings Section -->
            <section id="bookingsSection" class="content-section">
                <div class="section-header">
                    <h2>My Bookings</h2>
                    <p>Track your property bookings</p>
                </div>
                
                <!-- Booking Tabs -->
                <div class="booking-tabs">
                    <button class="booking-tab active" data-status="pending">Pending</button>
                    <button class="booking-tab" data-status="approved">Approved</button>
                    <button class="booking-tab" data-status="completed">Completed</button>
                </div>
                
                <div class="bookings-container" id="bookingsList">
                </div>
            </section>

            <!-- Messages Section -->
            <section id="messagesSection" class="content-section">
                <div class="section-header">
                    <h2>Messages</h2>
                    <p>Communicate with property owners</p>
                </div>
                <div class="messages-container" id="messagesList">
                </div>
            </section>
        </main>
    </div>

    <script src="./javascripts/services/StorageService.js"></script>
    <script src="./javascripts/services/AuthService.js"></script>
    <script src="./javascripts/services/PropertyService.js"></script>
    <script src="./javascripts/services/BookingService.js"></script>
    <script src="./javascripts/tenant-profile.js"></script>
</body>
</html>
