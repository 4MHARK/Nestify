<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register Modal Example</title>

</head>
<body><!-- Demo Button to Open Modal -->
    <button class="btn-login">Open Login Modal</button>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <!-- Close Button -->
            <button class="modal-close" id="closeModal">&times;</button>

            <!-- Tabs -->
            <div class="tabs-container">
                <button class="tab active" data-tab="signin">Sign In</button>
                <button class="tab" data-tab="register">Create Account</button>
            </div>

            <!-- Form Container -->
            <div class="form-container">
                <!-- Gold Accent -->
                <div class="gold-accent"></div>

                <!-- Sign In Form -->
                <div class="form-content active" id="signin">
                    <h2 class="form-title">Welcome Back</h2>
                    
                    <form id="signinForm">
                        <div class="form-group">
                            <label for="signin-email">Email Address</label>
                            <input type="email" id="signin-email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="signin-password">Password</label>
                            <input type="password" id="signin-password" placeholder="Enter your password" required>
                        </div>

                        <div class="forgot-password">
                            <a href="#forgot">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn-submit">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="form-content" id="register">
                    <h2 class="form-title">Create Your Account</h2>
                    
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="register-name">Full Name</label>
                            <input type="text" id="register-name" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="register-email">Email Address</label>
                            <input type="email" id="register-email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="register-password">Password</label>
                            <input type="password" id="register-password" placeholder="Create a password" required>
                        </div>

                        <div class="role-selection">
                            <label>I am a:</label>
                            <div class="role-options">
                                <div class="role-option">
                                    <input type="radio" id="role-tenant" name="role" value="tenant" checked>
                                    <label for="role-tenant">🏠 Tenant</label>
                                </div>
                                <div class="role-option">
                                    <input type="radio" id="role-landlord" name="role" value="landlord">
                                    <label for="role-landlord">🔑 Landlord</label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
