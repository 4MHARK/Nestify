<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Listings - Nestify</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/property-listings.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
    <!-- Header -->
    <header class="sticky-header">
        <nav class="nav-container">
            <div class="logo">
                <img src="./img/logo.png" alt="Nestify" class="brand-logo">
                <span class="brand-name">Nestify</span>
            </div>
            
            <div class="search-bar">
                <span class="material-symbols-outlined">search</span>
                <input type="text" placeholder="Search by city, neighborhood, or ZIP" id="searchInput">
            </div>
            
            <div class="nav-links">
                <a href="#" class="active">Buy</a>
                <a href="#">Rent</a>
                <a href="#">Sell</a>
                <a href="#">Agents</a>
            </div>
            
            <div class="user-actions">
                <button class="btn-list-property">List Property</button>
                <div class="user-profile" id="userProfile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="tenant-profile.html">My Profile</a>
                        <a href="tenant-profile.html">My Bookings</a>
                        <a href="tenant-profile.html">Favorites</a>
                        <hr>
                        <a href="#" id="logoutBtn">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-container">
        <!-- Left Sidebar Filters -->
        <aside class="filters-sidebar">
            <div class="filters-header">
                <h3><span class="material-symbols-outlined">tune</span> Filters</h3>
                <button class="reset-btn" id="resetFilters">Reset All</button>
            </div>
            
            <!-- Price Range -->
            <div class="filter-section">
                <h4>Price Range</h4>
                <div class="price-inputs">
                    <input type="number" placeholder="Min" id="priceMin">
                    <span>to</span>
                    <input type="number" placeholder="Max" id="priceMax">
                </div>
                <div class="price-presets">
                    <button data-min="0" data-max="100000">$0 - $100k</button>
                    <button data-min="100000" data-max="300000">$100k - $300k</button>
                    <button data-min="300000" data-max="500000">$300k - $500k</button>
                    <button data-min="500000" data-max="">$500k+</button>
                </div>
            </div>
            
            <!-- Property Type -->
            <div class="filter-section">
                <h4>Property Type</h4>
                <div class="filter-options">
                    <label class="filter-option">
                        <input type="radio" name="propertyType" value="" checked>
                        <span>All Properties</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="propertyType" value="apartment">
                        <span>Apartment</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="propertyType" value="house">
                        <span>House</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="propertyType" value="villa">
                        <span>Villa</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="propertyType" value="condo">
                        <span>Condo</span>
                    </label>
                </div>
            </div>
            
            <!-- Bedrooms -->
            <div class="filter-section">
                <h4>Bedrooms</h4>
                <div class="filter-options">
                    <label class="filter-option">
                        <input type="radio" name="bedrooms" value="" checked>
                        <span>Any</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="bedrooms" value="1">
                        <span>1+</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="bedrooms" value="2">
                        <span>2+</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="bedrooms" value="3">
                        <span>3+</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="bedrooms" value="4">
                        <span>4+</span>
                    </label>
                </div>
            </div>
            
            <button class="apply-filters-btn" id="applyFilters">Apply Filters</button>
        </aside>
        
        <!-- Right Content -->
        <section class="listings-content">
            <!-- Grid Header -->
            <div class="listings-header">
                <div>
                    <h1>Properties for Sale</h1>
                    <p class="results-count" id="resultsCount">Showing properties</p>
                </div>
                <div class="sort-section">
                    <label>Sort by:</label>
                    <select id="sortSelect">
                        <option value="newest">Newest Listings</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                    </select>
                </div>
            </div>
            
            <!-- Property Grid -->
            <div class="properties-grid" id="propertiesGrid">
                <!-- Properties will be rendered here -->
            </div>
            
            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <!-- Pagination will be rendered here -->
            </div>
        </section>
    </main>

    <script src="./javascripts/services/StorageService.js"></script>
    <script src="./javascripts/services/AuthService.js"></script>
    <script src="./javascripts/services/PropertyService.js"></script>
    <script src="./javascripts/property-listings.js"></script>
</body>
</html>
