<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Dashboard - Nestify</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="./css/dashboard-pro.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="./img/logo.png" alt="Nestify" class="brand-logo">
                <span class="brand-name">Nestify</span>
            </div>
            
            <nav class="sidebar-menu">
                <div class="menu-section">
                    <span class="menu-label">Main</span>
                    <a href="#" class="menu-item active" data-section="browse">
                        <span class="material-symbols-outlined">search</span>
                        <span>Browse</span>
                    </a>
                    <a href="#" class="menu-item" data-section="bookings">
                        <span class="material-symbols-outlined">event_note</span>
                        <span>My Bookings</span>
                    </a>
                    <a href="#" class="menu-item" data-section="messages">
                        <span class="material-symbols-outlined">chat</span>
                        <span>Messages</span>
                        <span class="badge" id="messageBadge" style="display: none;">0</span>
                    </a>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="username">Tenant</span>
                        <span class="user-role">Tenant</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <h1>Find Your Dream Home</h1>
                    <p class="header-subtitle">Welcome back, <span id="welcomeName">Tenant</span></p>
                </div>
            </header>

            <!-- Browse Section -->
            <section id="browseSection" class="content-section active">
                <!-- Filters -->
                <div class="filters-bar">
                    <div class="search-input-wrapper">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" id="searchInput" placeholder="Search properties..." class="search-filter">
                    </div>
                    <select id="typeFilter" class="filter-select">
                        <option value="">All Types</option>
                        <option value="apartment">Apartment</option>
                        <option value="house">House</option>
                        <option value="villa">Villa</option>
                        <option value="condo">Condo</option>
                        <option value="townhouse">Townhouse</option>
                    </select>
                    <select id="priceFilter" class="filter-select">
                        <option value="">All Prices</option>
                        <option value="0-100000">Under $100k</option>
                        <option value="100000-300000">$100k - $300k</option>
                        <option value="300000-500000">$300k - $500k</option>
                        <option value="500000+">$500k+</option>
                    </select>
                </div>

                <div class="section-header">
                    <h2>Available Properties</h2>
                    <p>Browse and book properties</p>
                </div>
                <div class="properties-grid" id="propertiesList">
                </div>
            </section>

            <!-- Bookings Section -->
            <section id="bookingsSection" class="content-section">
                <div class="section-header">
                    <h2>My Bookings</h2>
                    <p>Track your property bookings</p>
                </div>
                <div class="bookings-container" id="bookingsList">
                </div>
            </section>

            <!-- Messages Section -->
            <section id="messagesSection" class="content-section">
                <div class="section-header">
                    <h2>Messages</h2>
                    <p>Communicate with property owners</p>
                </div>
                <div class="messages-container" id="messagesList">
                </div>
            </section>
        </main>
    </div>

    <!-- Booking Modal -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Request Booking</h2>
                <button class="modal-close" id="closeBookingModal">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="booking-property-preview" id="bookingPropertyInfo">
            </div>
            <form id="bookingForm" class="modal-form">
                <input type="hidden" id="bookingPropertyId">
                <div class="form-group">
                    <label for="bookingMessage">Message to Owner</label>
                    <textarea id="bookingMessage" rows="3" placeholder="Introduce yourself and ask any questions about the property..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelBookingBtn">Cancel</button>
                    <button type="submit" class="btn-submit">Send Request</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./javascripts/services/StorageService.js"></script>
    <script src="./javascripts/services/AuthService.js"></script>
    <script src="./javascripts/services/PropertyService.js"></script>
    <script src="./javascripts/services/BookingService.js"></script>
    <script src="./javascripts/services/MessageService.js"></script>
    <script src="./javascripts/core/RouteGuard.js"></script>
    <script src="./javascripts/dashboard/tenant-dashboard.js"></script>
</body>

</html>
