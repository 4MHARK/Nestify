<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../media-query.css">
    <title>Dashboard - Nestify</title>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="logo">
                    <i class="fas fa-home"></i> <span>Nestify</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#properties" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>My Properties</span>
                </a>
                <a href="#bookings" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Bookings</span>
                </a>
                <a href="#messages" class="nav-item">
                    <i class="fas fa-comment-alt"></i>
                    <span>Messages</span>
                </a>
                <a href="#tenants" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Tenants</span>
                </a>
                <a href="#finance" class="nav-item">
                    <i class="fas fa-dollar-sign"></i>
                    <span>Finance</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="user-name">User</span>
                        <span class="user-role">Landlord</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="Auth.logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1>Welcome back, <span id="welcome-name">User</span></h1>
                <button class="btn btn-primary" id="add-property-btn">
                    <i class="fas fa-plus"></i> Add Property
                </button>
            </header>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-number" id="total-properties">0</span>
                        <span class="stat-label">Properties</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-number" id="active-bookings">0</span>
                        <span class="stat-label">Active Bookings</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-number" id="total-revenue">$0</span>
                        <span class="stat-label">Total Revenue</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-number" id="total-tenants">0</span>
                        <span class="stat-label">Tenants</span>
                    </div>
                </div>
            </div>

            <!-- My Properties Section -->
            <section class="properties-section">
                <div class="section-header">
                    <h2>My Properties</h2>
                    <p>Manage your property listings</p>
                </div>
                <div class="property-grid" id="my-properties">
                    <!-- Properties will be rendered here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Add Property Modal -->
    <div class="modal-overlay" id="propertyModal">
        <div class="modal-card property-modal-card">
            <button class="modal-close" id="closePropertyModal">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="form-title">Add New Property</h2>
            
            <form id="addPropertyForm">
                <div class="form-group">
                    <label for="property-title">Property Title</label>
                    <input type="text" id="property-title" placeholder="e.g. Modern Family Home" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="property-type">Listing Type</label>
                        <select id="property-type" required>
                            <option value="">Select Type</option>
                            <option value="sale">For Sale</option>
                            <option value="rent">For Rent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="property-price">Price ($)</label>
                        <input type="number" id="property-price" placeholder="e.g. 450000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="property-location">Location</label>
                    <input type="text" id="property-location" placeholder="e.g. Beverly Hills, CA" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="property-bedrooms">Bedrooms</label>
                        <input type="number" id="property-bedrooms" placeholder="e.g. 4" required>
                    </div>
                    <div class="form-group">
                        <label for="property-bathrooms">Bathrooms</label>
                        <input type="number" id="property-bathrooms" placeholder="e.g. 3" required>
                    </div>
                    <div class="form-group">
                        <label for="property-sqft">Sq Ft</label>
                        <input type="number" id="property-sqft" placeholder="e.g. 2500">
                    </div>
                </div>

                <div class="form-group">
                    <label for="property-image">Image URL</label>
                    <input type="url" id="property-image" placeholder="https://example.com/image.jpg" required>
                </div>

                <div class="form-group">
                    <label>Amenities</label>
                    <div class="amenities-grid">
                        <label class="amenity-option">
                            <input type="checkbox" name="amenities" value="Pool">
                            <span><i class="fas fa-swimming-pool"></i> Pool</span>
                        </label>
                        <label class="amenity-option">
                            <input type="checkbox" name="amenities" value="Garage">
                            <span><i class="fas fa-car"></i> Garage</span>
                        </label>
                        <label class="amenity-option">
                            <input type="checkbox" name="amenities" value="Garden">
                            <span><i class="fas fa-leaf"></i> Garden</span>
                        </label>
                        <label class="amenity-option">
                            <input type="checkbox" name="amenities" value="Gym">
                            <span><i class="fas fa-dumbbell"></i> Gym</span>
                        </label>
                        <label class="amenity-option">
                            <input type="checkbox" name="amenities" value="Parking">
                            <span><i class="fas fa-parking"></i> Parking</span>
                        </label>
                        <label class="amenity-option">
                            <input type="checkbox" name="amenities" value="Security">
                            <span><i class="fas fa-shield-alt"></i> Security</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Add Property</button>
            </form>
        </div>
    </div>

    <script src="../javascripts/auth.js"></script>
    <script src="../javascripts/dashboard.js"></script>
</body>

</html>
